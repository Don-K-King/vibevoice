version: '3.8'

services:
  vibevoice-asr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibevoice-asr
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount local model cache directory
      - ./model_cache:/root/.cache/huggingface
    restart: unless-stopped
    ipc: host
    ulimits:
      memlock: -1
      stack: -1
    shm_size: '16gb'
